[project]
name = "daily-recipe-cli"
version = "0.1.0"
description = "每日带饭食谱推荐命令行工具"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recipe = "daily_recipe_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_recipe_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
